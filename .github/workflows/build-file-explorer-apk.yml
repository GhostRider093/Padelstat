name: Build SimpleFileExplorer APK

on:
  push:
    branches:
      - claude/android-file-explorer-THprZ
    paths:
      - 'SimpleFileExplorer/**'
      - '.github/workflows/build-file-explorer-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: SimpleFileExplorer
        run: gradle --no-daemon assembleDebug

      - name: Copy APK into repo (dist/)
        run: |
          mkdir -p SimpleFileExplorer/dist
          cp SimpleFileExplorer/app/build/outputs/apk/debug/app-debug.apk \
             SimpleFileExplorer/dist/SimpleFileExplorer-debug.apk

      - name: Commit APK back to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SimpleFileExplorer/dist/SimpleFileExplorer-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "build: SimpleFileExplorer debug APK [skip ci]"
            git push
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleFileExplorer-debug
          path: SimpleFileExplorer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
